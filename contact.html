  <main>
    <h2>Contact Me</h2>
    <form id="contact-form" novalidate>
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Ushie Mary Omali">

      <label for="email">Email Address</label>
      <input type="text" id="email" placeholder="u.mary0076@miva.com">

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" placeholder="Digits only, e.g. 08069949674">

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Write your message"></textarea>

      <p id="form-feedback"></p>
      <button type="submit">Send Message</button>
    </form>
  </main>
